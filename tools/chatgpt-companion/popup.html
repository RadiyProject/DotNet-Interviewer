<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="select-control.css"><script defer src="select-control.js"></script><script defer src="popup.js"></script></head><body>
<h1>Forge · ChatGPT Voice</h1><label>Language / Язык <select id="language"><option value="ru">Русский</option><option value="en">English</option></select></label>
<details class="help-section"><summary data-ru="Как это работает" data-en="How it works"></summary><p data-ru="Настоящий голос ChatGPT — в его вкладке. Расширение передаёт выбранный контекст и читает только видимую переписку связанного чата. API-ключ не нужен." data-en="Native ChatGPT Voice runs in its tab. This extension shares selected context and reads the bound chat's visible transcript. No API key required."></p></details>
<button id="auto-connect" data-ru="Подключить открытое интервью" data-en="Connect the open interview"></button>
<div id="pairing-setup"><label>Forge URL<input id="origin" value="http://localhost:8080"></label>
<p class="token-help" data-ru="Открой нужный раунд в тренажёре (можно в Safari). Расширение найдёт его через localhost. Подтверди привязку на странице интервью — токен передастся автоматически." data-en="Open the round in the trainer (Safari works too). The companion finds it through localhost. Approve pairing on the interview page; the token transfers automatically."></p>
<details><summary data-ru="Ручной ввод токена — запасной вариант" data-en="Manual token — fallback"></summary>
<label data-ru="Токен привязки из тренажёра" data-en="Pairing token from the trainer"></label><input id="token" type="password" autocomplete="off" aria-describedby="token-help"><p id="token-help" class="note" data-ru="В карточке подключения ChatGPT есть ручная привязка. Токен Codex-моста сюда не нужен." data-en="The ChatGPT connection card has a manual pairing option. Do not use the Codex bridge token here."></p>
<button id="connect" data-ru="Подключить по токену" data-en="Connect using token"></button></details>
</div><section id="connected" hidden><strong id="name"></strong><details class="start-steps" open><summary data-ru="Порядок запуска интервью" data-en="Interview startup steps"></summary><ol><li data-ru="Подключи интервью и выбери вкладку ChatGPT." data-en="Pair the interview and select a ChatGPT tab."></li><li data-ru="Отметь согласие и нажми «Передать контекст в ChatGPT». Дождись подтверждения доставки." data-en="Allow sharing and click Send context to ChatGPT. Wait for delivery confirmation."></li><li data-ru="Перейди во вкладку ChatGPT и самостоятельно нажми «Начать голосовой разговор» рядом с полем сообщения. Разреши микрофон, если браузер спросит." data-en="Go to the ChatGPT tab and manually click Start voice conversation beside the message field. Allow the microphone if prompted."></li><li data-ru="Когда голос готов, нажми «Начать интервью» здесь или на сайте. Запустится таймер, а сообщение о старте передастся в ChatGPT автоматически. Если текст остался в поле ChatGPT, нажми отправку." data-en="When Voice is ready, click Start interview here or in the trainer. The timer starts and a start message is sent to ChatGPT automatically. If the text remains in the ChatGPT composer, send it manually."></li></ol></details><p id="setup-step" role="status"></p><details class="tab-settings" open><summary data-ru="Вкладка ChatGPT" data-en="ChatGPT tab"></summary><div class="row"><button id="new-tab" data-ru="Открыть ChatGPT" data-en="Open ChatGPT"></button><button id="bind-current" data-ru="Связать текущую вкладку" data-en="Bind current tab"></button></div>
<button id="check-tab" data-ru="Проверить подключение к вкладке" data-en="Check tab connection"></button></details><details class="context-section"><summary data-ru="Контекст для ассистента" data-en="Assistant context"></summary><button id="preview" aria-expanded="false" aria-controls="preview-text" data-ru="Показать следующий контекст" data-en="Preview next context"></button><textarea id="preview-text" rows="8" readonly hidden></textarea>
</details><label id="consent-field"><input type="checkbox" id="consent"><span data-ru="Разрешаю отправить выбранное резюме, легенду и задания в этот чат ChatGPT и сохранять его видимую расшифровку в Forge." data-en="Allow sharing the selected resume, narrative and tasks in this ChatGPT chat and saving its visible transcript to Forge."></span></label>
<button id="check-delivery" data-ru="Контекст уже в чате · проверить доставку" data-en="Context already in chat · check delivery"></button><button id="send" data-ru="Передать контекст в ChatGPT" data-en="Send context to ChatGPT"></button><button id="begin" data-ru="Начать интервью · запустить таймер" data-en="Start interview · start timer"></button><p class="note" data-ru="Подключение, передача контекста и проверка голоса не запускают таймер. Нажми «Начать интервью», когда будешь готов." data-en="Pairing, sharing context and checking Voice do not start the timer. Click Start interview when you are ready."></p><button id="voice" data-ru="Попробовать открыть голос · вспомогательная кнопка" data-en="Try opening Voice · optional shortcut"></button>
<details class="automation-settings"><summary data-ru="Автоматизация и синхронизация" data-en="Automation and sync"></summary><label><input id="auto-sync" type="checkbox"><span data-ru="Автоматически сохранять видимую расшифровку" data-en="Automatically save the visible transcript"></span></label><label><input id="auto-updates" type="checkbox"><span data-ru="Автоматически отправлять обновления, которые я выбрал в Forge" data-en="Automatically send updates I select in Forge"></span></label>
<p class="note" data-ru="Если голос скрывает поле ввода, обновления ждут. После разговора заверши Voice в ChatGPT, дождись полной расшифровки и нажми кнопку ниже. Расширение не записывает звук. Одна вкладка — одно собеседование." data-en="If Voice hides the composer, updates wait. After talking, exit Voice in ChatGPT, wait for the full transcript, then use the button below. This extension does not record audio. One tab per interview."></p>
</details><button id="sync" data-ru="Сохранить расшифровку сейчас" data-en="Sync transcript now"></button><button id="finish" data-ru="Завершить и передать на разбор Codex CLI" data-en="Finish and send for Codex CLI debrief"></button><button id="disconnect" data-ru="Отключиться от интервью" data-en="Disconnect interview"></button></section>
<pre id="status" role="status"></pre>
<details><summary data-ru="Диагностика подключения" data-en="Connection diagnostics"></summary><p data-ru="Журнал хранится до перезапуска браузера. Без токенов, резюме и переписки. Выдели текст, чтобы скопировать." data-en="Stored until browser restart. No tokens, resume or chat content. Select the text to copy."></p><button id="diagnostics" data-ru="Показать журнал" data-en="Show log"></button><pre id="diagnostic-log"></pre></details>
<p class="note" data-ru="Автоматизация интерфейса не является официальным API ChatGPT. При изменении страницы используй ручную передачу контекста и импорт расшифровки в тренажёре." data-en="UI automation is not an official ChatGPT API. If the page changes, use manual context transfer and transcript import in the trainer."></p>
</body></html>
